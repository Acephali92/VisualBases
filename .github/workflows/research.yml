name: Recherche

# Sammelt Quellen-Kandidaten und Lage-/Statusprüfungen (Wikipedia, Wikidata, OpenStreetMap,
# Base Structure Report) von GitHub-Servern aus – die Cloud-Entwicklungsumgebung wird von
# Wikimedia und Overpass gedrosselt. Ergebnisse landen auf dem Branch "research-data";
# sie werden erst nach Durchsicht in die Anwendung übernommen (docs/research/SOURCE-RESEARCH.md).
on:
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths:
      - 'scripts/research/**'
      - '.github/workflows/research.yml'

permissions:
  contents: write

concurrency:
  group: research
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/research
          key: research-cache-${{ github.run_id }}
          restore-keys: research-cache-

      - name: Base Structure Report (FY2023/FY2019)
        run: node scripts/research/bsr.mjs
      - name: Wikidata
        run: node scripts/research/wikidata.mjs
      - name: Wikipedia-Einzelnachweise
        run: node scripts/research/wiki-refs.mjs
      - name: OpenStreetMap-Lageprüfung
        run: node scripts/research/osm-check.mjs
        continue-on-error: true

      - name: Ergebnisse auf Branch research-data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B research-data
          git add data/research
          git commit -m "Recherche-Daten vom ${GITHUB_SHA::7} ($(date -u +%Y-%m-%d))" || echo "keine Änderungen"
          git push -f origin research-data
